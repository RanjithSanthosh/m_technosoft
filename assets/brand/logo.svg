<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 72" fill="none" class="w-auto h-10">
  <defs>
    <!-- Geometric MT Gradient -->
    <linearGradient id="mt-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A00" />
      <stop offset="35%" stop-color="#E11D48" />
      <stop offset="70%" stop-color="#C21878" />
      <stop offset="100%" stop-color="#6A0DAD" />
    </linearGradient>
    <linearGradient id="mt-grad-accent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8533" />
      <stop offset="60%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="mt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#C21878" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Geometric MT Monogram Symbol -->
  <g transform="translate(6, 6)" filter="url(#mt-glow)">
    <!-- Base geometric facet M left leg -->
    <path d="M4 52 L4 12 L18 12 L28 34 L28 52 Z" fill="url(#mt-grad-primary)"/>
    <!-- Central diamond / chevron apex -->
    <path d="M28 34 L38 12 L48 34 L38 56 Z" fill="url(#mt-grad-accent)" fill-opacity="0.95"/>
    <!-- Geometric M right leg interlocked with T -->
    <path d="M48 34 L58 12 L72 12 L72 52 L58 52 L58 34 Z" fill="url(#mt-grad-primary)"/>
    <!-- Crossbar and stem forming T geometry -->
    <path d="M22 12 L64 12 L64 20 L42 20 L42 56 L34 56 L34 20 L22 20 Z" fill="#FFFFFF" fill-opacity="0.92"/>
    <path d="M34 20 L42 20 L42 54 L34 54 Z" fill="url(#mt-grad-primary)"/>
  </g>

  <!-- Typography: Muruganantham Technosoft -->
  <g transform="translate(94, 14)">
    <!-- Brand Name Line 1: MURUGANANTHAM -->
    <text x="0" y="20" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="17" font-weight="800" letter-spacing="1.5" fill="#FFFFFF">
      MURUGANANTHAM
    </text>
    <!-- Brand Name Line 2: TECHNOSOFT -->
    <text x="0" y="38" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="3.2" fill="#94A3B8">
      TECHNO<tspan fill="#FF6A00">SOFT</tspan>
    </text>
    <!-- Tagline: Innovate | Develop | Transform -->
    <text x="1" y="51" font-family="'Inter', system-ui, sans-serif" font-size="7.5" font-weight="600" letter-spacing="1.8" fill="#C21878">
      INNOVATE <tspan fill="#64748B">|</tspan> DEVELOP <tspan fill="#64748B">|</tspan> TRANSFORM
    </text>
  </g>
</svg>
