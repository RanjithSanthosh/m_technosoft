<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="gem-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="#090D16"/>
  <rect width="800" height="42" fill="#04070D"/>
  <circle cx="24" cy="21" r="5" fill="#EF4444"/><circle cx="40" cy="21" r="5" fill="#F59E0B"/><circle cx="56" cy="21" r="5" fill="#10B981"/>
  <rect x="220" y="10" width="360" height="22" rx="6" fill="#1E293B"/>
  <text x="320" y="25" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">geminiai-ranjith.netlify.app</text>

  <!-- Sidebar + Main layout -->
  <rect y="42" width="220" height="408" fill="#0F172A" stroke="#1E293B"/>
  <text x="24" y="80" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Gemini AI Workspace</text>
  <rect x="20" y="100" width="180" height="32" rx="6" fill="url(#gem-grad)"/>
  <text x="56" y="121" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">+ New Chat</text>
  <rect x="20" y="145" width="180" height="28" rx="6" fill="#1E293B"/>
  <text x="32" y="163" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">Architecture audit...</text>
  <rect x="20" y="180" width="180" height="28" rx="6" fill="#1E293B"/>
  <text x="32" y="198" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11">SQL Query optimization...</text>

  <!-- Chat area -->
  <rect x="240" y="65" width="530" height="70" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="260" y="95" fill="#A5B4FC" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">USER PROMPT</text>
  <text x="260" y="118" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="13">Explain how token streaming improves time-to-first-token in conversational AI.</text>

  <rect x="240" y="150" width="530" height="180" rx="10" fill="#111827" stroke="#374151"/>
  <text x="260" y="180" fill="#F472B6" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">GEMINI AI RESPONSE (STREAMING)</text>
  <text x="260" y="210" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13">Token streaming transfers chunks via Server-Sent Events (SSE) immediately as</text>
  <text x="260" y="235" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="13">they are generated, eliminating blocking waits on full completion payloads.</text>
  <rect x="260" y="255" width="490" height="55" rx="6" fill="#030712"/>
  <text x="275" y="285" fill="#10B981" font-family="monospace" font-size="12">const stream = await ai.generateContentStream(prompt);</text>

  <rect x="240" y="350" width="530" height="55" rx="8" fill="#1E293B" stroke="#475569"/>
  <text x="260" y="383" fill="#64748B" font-family="system-ui, sans-serif" font-size="13">Message Gemini AI...</text>
</svg>
